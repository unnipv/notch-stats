name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build universal app
        run: ./build.sh

      - name: Package
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent build/NotchStats.app build/NotchStats.zip
          shasum -a 256 build/NotchStats.zip | tee build/NotchStats.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchStats
          path: |
            build/NotchStats.zip
            build/NotchStats.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/NotchStats.zip
            build/NotchStats.zip.sha256
          generate_release_notes: true
